spring.application.name=orc-energy-management
server.port=${PORT:8080}
spring.datasource.url=${MYSQL_URL:jdbc:h2:file:./data/orcdb-demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${MYSQL_USERNAME:sa}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.h2.console.enabled=true
spring.h2.console.path=/dev/h2-console
